services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cphub
      POSTGRES_PASSWORD: cphub
      POSTGRES_DB: cphub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cphub"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: uv run alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://cphub:cphub@db:5432/cphub
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://cphub:cphub@db:5432/cphub
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://cphub:cphub@db:5432/cphub
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
