name: Docker Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: dummy-token-for-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image and start web (pulls in db + migrate)
        run: docker compose up -d --build --wait web

      - name: Verify /health from host
        run: curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/health

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
